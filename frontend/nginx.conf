# Variable proxy_pass + resolver makes nginx re-resolve `gateway` via DNS, so
# `docker compose up --scale gateway=N` round-robins new connections.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  location /ws {
    set $gw http://gateway:8000;
    proxy_pass $gw;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_buffering off;
    tcp_nodelay on;
  }

  location ~ ^/(api|healthz|metrics) {
    set $gw http://gateway:8000;
    proxy_pass $gw;
  }
}
