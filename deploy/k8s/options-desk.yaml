# kubectl apply -f deploy/k8s/options-desk.yaml
# Build/push ./backend and ./frontend, then replace the image names below.
apiVersion: v1
kind: Namespace
metadata: {name: optdesk}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: optdesk}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - {name: redis, image: "redis:7-alpine", args: ["--save", "", "--appendonly", "no"], ports: [{containerPort: 6379}]}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: optdesk}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: feed, namespace: optdesk}
spec:
  replicas: 1   # single writer for the simulated feed
  selector: {matchLabels: {app: feed}}
  template:
    metadata: {labels: {app: feed}}
    spec:
      containers:
        - name: feed
          image: optdesk-backend:1.0.0
          args: ["feed"]
          env: [{name: OPTDESK_BUS_URL, value: "redis://redis:6379/0"}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pricer-a, namespace: optdesk}
spec:
  replicas: 1   # one replica per symbol shard
  selector: {matchLabels: {app: pricer-a}}
  template:
    metadata: {labels: {app: pricer-a}}
    spec:
      containers:
        - name: pricer
          image: optdesk-backend:1.0.0
          args: ["pricer"]
          env:
            - {name: OPTDESK_BUS_URL, value: "redis://redis:6379/0"}
            - {name: OPTDESK_PRICER_SYMBOLS, value: "SPY,QQQ"}
          resources: {requests: {cpu: 500m, memory: 128Mi}, limits: {cpu: "1", memory: 256Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pricer-b, namespace: optdesk}
spec:
  replicas: 1
  selector: {matchLabels: {app: pricer-b}}
  template:
    metadata: {labels: {app: pricer-b}}
    spec:
      containers:
        - name: pricer
          image: optdesk-backend:1.0.0
          args: ["pricer"]
          env:
            - {name: OPTDESK_BUS_URL, value: "redis://redis:6379/0"}
            - {name: OPTDESK_PRICER_SYMBOLS, value: "AAPL,NVDA,TSLA"}
          resources: {requests: {cpu: 500m, memory: 128Mi}, limits: {cpu: "1", memory: 256Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: optdesk}
spec:
  replicas: 3   # stateless; scale freely (see HPA)
  selector: {matchLabels: {app: gateway}}
  template:
    metadata:
      labels: {app: gateway}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      containers:
        - name: gateway
          image: optdesk-backend:1.0.0
          args: ["gateway"]
          ports: [{containerPort: 8000}]
          env: [{name: OPTDESK_BUS_URL, value: "redis://redis:6379/0"}]
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 10}
          resources: {requests: {cpu: 250m, memory: 128Mi}, limits: {cpu: "1", memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: optdesk}
spec: {selector: {app: gateway}, ports: [{port: 8000}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: gateway, namespace: optdesk}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 3
  maxReplicas: 20
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: optdesk}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - {name: web, image: "optdesk-web:1.0.0", ports: [{containerPort: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: optdesk}
spec: {type: LoadBalancer, selector: {app: web}, ports: [{port: 80}]}
